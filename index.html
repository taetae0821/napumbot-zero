<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>융통성 제로 AI 납품봇</title>
<style>
:root{--cream:#fff8e1;--yellow:#ffd54f;--sky:#81d4fa;--skyd:#0277bd;--ink:#263238;--ink2:#546e7a;--ok:#2e7d32;--warn:#e65100;--bad:#c62828;--card:#fff;--line:#455a64}
*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:22px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:9}
.top{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;padding:10px 14px 0}
.brand{font-weight:800;font-size:.8rem;color:var(--ink2)}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{min-height:48px;min-width:48px;padding:0 10px;font-size:.75rem;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.tg button[aria-pressed=true]{background:var(--sky);font-weight:800}
main{max-width:760px;margin:0 auto;padding:10px 14px 40px;outline:none}
h1{font-size:1.7rem;line-height:1.25;margin:.4rem 0}
h2{font-size:1.25rem;margin:.6rem 0 .3rem;outline:none}
h3{font-size:1rem;margin:.8rem 0 .3rem}
p{margin:.4rem 0}
.panel{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.panel.fact{background:#e1f5fe}
.panel.warn{background:#fff3e0;border-color:var(--warn)}
.chip{display:inline-block;background:var(--yellow);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;min-width:48px;padding:10px 18px;font-size:1rem;font-weight:800;border:3px solid var(--line);border-radius:14px;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn.sec{background:#fff}.btn.sky{background:var(--sky)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible,.tg button:focus-visible,.dot:focus-visible,.row:focus-visible{outline:4px solid #6a1b9a;outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.choice{display:block;width:100%;min-height:64px;text-align:left;font-size:1rem;padding:12px 14px;margin:10px 0;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.choice[aria-pressed=true]{background:#e1f5fe;border-color:var(--skyd);box-shadow:inset 0 0 0 3px var(--skyd);font-weight:800}
.choice[aria-pressed=true]::before{content:"✔ 선택함 · ";color:var(--skyd)}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.dot{min-height:48px;min-width:48px;border:3px solid var(--line);border-radius:12px;background:#fff;font-weight:800;font-size:.9rem;cursor:pointer}
.dot.cur{background:var(--yellow)}.dot.set{border-color:var(--skyd)}
.dot.set::after{content:" ✔"}
details{margin:8px 0}summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:800}
ul{margin:.3rem 0;padding-left:1.3rem}li{margin:.25rem 0}
.chars{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:10px 0}
.chr{width:92px;height:auto;flex:none}
.say{flex:1;min-width:0;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 12px;margin:6px 0;font-size:.95rem}
.say b{display:block;font-size:.75rem;color:var(--ink2)}
.say.z{background:#eceff1}.say.l{background:#e1f5fe}
.scene{background:linear-gradient(#b3e5fc,#fff8e1);border:3px solid var(--line);border-radius:18px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;text-align:center}
.big-emoji{font-size:2.6rem;line-height:1.25;word-break:break-all;display:inline-block}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border:2px solid var(--line);border-radius:8px;padding:0 8px;margin-right:6px;background:#fff}
.t2{color:var(--ok);border-color:var(--ok)}.t1{color:var(--warn);border-color:var(--warn)}.t0{color:var(--bad);border-color:var(--bad)}
.stars{font-size:2rem;letter-spacing:4px;color:#f9a825}
.row{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:.95rem;cursor:pointer;color:var(--ink)}
.row[aria-pressed=true]{background:#fffde7;border-color:var(--skyd)}
.small{font-size:.8rem;color:var(--ink2)}
.drive .chr{animation:drive 2.6s ease-in-out both}
.pile .big-emoji{animation:pop .6s ease-out both,wob .5s .6s 3}
.tall .big-emoji{animation:grow .9s ease-out both}
.run .big-emoji,.slide .big-emoji,.queue .big-emoji{animation:dash 1.2s ease-in-out 2 alternate}
.wobble .big-emoji,.lock .big-emoji,.heavy .big-emoji{animation:wob .5s 3}
.books .big-emoji{animation:suck 1.2s ease-in}
.stamp .big-emoji{animation:pop .5s ease-out both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes grow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes dash{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes suck{from{transform:translateY(40px);opacity:.3}to{transform:translateY(0);opacity:1}}
@keyframes drive{from{transform:translateX(-120px)}to{transform:translateX(0)}}
html.calm *,html.calm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
canvas.sh,img.sh{width:100%;max-width:420px;height:auto;display:block;margin:10px auto;border:3px solid var(--line);border-radius:12px;background:#fff}
@media (max-width:420px){h1{font-size:1.45rem}.chr{width:72px}.big-emoji{font-size:2.2rem}}
</style>
</head>

function evaluate(picks){
  if(picks.length!==5||picks.some(c=>!c))throw new Error("다섯 항목을 모두 선택하세요.");
  const score=picks.reduce((s,c)=>s+c.s,0);
  const issues=picks.filter(c=>c.s<2);
  const criticals=issues.filter(c=>c.crit);
  const stars=criticals.length?1:score===10?3:score>=6?2:1;
  const lead=criticals[0]||issues.find(c=>c.s===0)||issues[0]||null;
  return{score,stars,issues,criticals,lead,leadId:lead?lead.id:null};
}

 const cards=ord.map(ci=>{const c=it.cards[ci];return '<button class="choice" data-a="pick" data-c="'+ci+'" aria-pressed="'+(S.picks[S.step]===c.id)+'">'+c.t+'</button>';}).join("");
 const last=S.step===4;
 return '<p><span class="chip">의뢰 '+(S.round+1)+'/3 · '+R.place+'</span></p><h2 tabindex="-1">항목 '+(S.step+1)+'/5 · '+it.n+'</h2><div class="dots" role="group" aria-label="항목 이동">'+dots+'</div><details><summary>의뢰와 사실 다시 보기</summary><div class="panel fact"><p><b>'+R.req+'</b></p><ul>'+R.facts.map(f=>'<li>'+f+'</li>').join("")+'</ul></div></details><div role="group" aria-label="'+it.n+' 조건 카드">'+cards+'</div>'+(S.picks[S.step]?bubble("제로","조건을 기록했습니다. 발주 전까지 바꿀 수 있습니다."):"")+'<div class="btns"><button class="btn sky" data-a="hint" aria-expanded="'+S.hint+'">루루에게 묻기</button></div>'+(S.hint?bubble("루루",it.h+" (힌트는 몇 번 써도 괜찮아요.)"):"")+'<div class="btns">'+(S.step>0?'<button class="btn sec" data-a="prev">이전</button>':"")+(last?'<button class="btn" data-a="review"'+(allPicked()?"":" disabled")+'>발주 검토</button>':'<button class="btn" data-a="next">다음</button>')+'</div>'+(last&&!allPicked()?'<p class="small">아직 고르지 않은 항목: '+missing.join(", ")+'</p>':"");}
function vReview(){const R=ROUNDS[S.round];
 return '<p><span class="chip">의뢰 '+(S.round+1)+'/3 · '+R.place+'</span></p><h2 tabindex="-1">발주 전 확인</h2><p>고른 조건을 확인하세요. 확정하면 제로가 납품을 시작해요.</p>'+R.items.map((it,i)=>'<div class="panel"><b>'+it.n+'</b><br>'+BY_ID[S.picks[i]].t+'<div class="btns"><button class="btn sec" data-a="edit" data-i="'+i+'">이 항목 수정</button></div></div>').join("")+'<div class="btns"><button class="btn sec" data-a="edit" data-i="0">수정하기</button><button class="btn" data-a="order">발주 확정</button></div>';}
function vDeliver(){return '<h2 tabindex="-1">납품 중…</h2><div class="drive">'+scene("📦🚚💨","","제로가 조건을 글자 그대로 읽고 물건을 가져오는 중이에요.")+'<div class="chars">'+zero("oops")+'</div></div><div class="btns"><button class="btn sec" data-a="skipdel">연출 건너뛰기</button></div>';}
function rowHtml(c,i,sel){const t=c.s===2?'<span class="tag t2">✅ 적합</span>':c.s===1?'<span class="tag t1">△ 보완 필요</span>':'<span class="tag t0">✖ 큰 문제</span>';
 return '<button class="row" data-a="scene" data-i="'+i+'" aria-pressed="'+(sel===i)+'"><b>'+ROUNDS[c.r].items[c.i].n+'</b> '+t+(c.crit?'<span class="tag t0">핵심</span>':'')+'<br>'+c.t+'<br><span class="small">'+c.o+'</span></button>';}
function vResult(){const r=S.res,R=ROUNDS[r.round],picks=r.picks;
 const sel=S.shown==null?(r.lead?picks.indexOf(r.lead):-1):S.shown;
 const c=sel>=0?picks[sel]:null;
 let sc;
 if(c&&c.s<2)sc=scene(c.e,c.a,c.o,"이 조건의 결과 예시 · 선택한 조건: “"+c.t+"”")+(c.zq?bubble("제로","“"+c.zq+"”"):"")+bubble("루루",LULU_KIND[c.k]);
 else sc=scene(R.normal.e,"",R.normal.cap,c?"이 조건의 결과 예시 · 선택한 조건: “"+c.t+"”":"")+bubble("제로","이번에는 현장에 맞는 조건입니다.")+bubble("루루","필요한 만큼, 제대로 쓸 수 있게 준비했어요!");
 const crit=r.criticals.length?'<div class="panel warn"><b>핵심 조건 때문에 별이 1개로 제한됐어요.</b><br>다른 조건이 맞아도 아래 “핵심” 표시 항목 때문에 사용이나 확인에 큰 문제가 생겨요.</div>':"";
 const kindNote=c&&c.s<2?'<p class="small">'+c.k+' · '+KIND_NOTE[c.k]+'</p>':"";
 const last=S.round===2||S.fromEnd;
 return '<p><span class="chip">의뢰 '+(r.round+1)+'/3 · '+R.place+'</span></p><h2 tabindex="-1">결과: '+STAR_NAME[r.stars]+'</h2><p>'+stars(r.stars)+' &nbsp;<b>'+r.score+' / 10점</b></p>'+crit+sc+kindNote+'<p class="small">이 장면은 가상의 과장된 예시예요. 점수는 구매 계획의 적합도이며, 낮은 점수가 곧 물품 하자를 뜻하지는 않아요.</p><h3>내가 고른 5개 조건 (눌러서 장면 보기)</h3>'+picks.map((p,i)=>rowHtml(p,i,sel)).join("")+'<div class="panel fact"><b>배운 점</b><br>'+R.learn+'</div><div class="btns"><button class="btn sec" data-a="fix">조건 고치기</button><button class="btn sec" data-a="again">새로 풀기</button><button class="btn" data-a="nextr">'+(last?"마무리 보기":"다음 의뢰")+'</button></div>';}
function totalStars(){return S.best.reduce((s,b)=>s+(b?b.stars:0),0);}
function vEnd(){const t=totalStars(),g=gradeOf(t);
 return '<h2 tabindex="-1">마무리</h2><div class="chars">'+zero("happy")+lulu()+'</div><div class="panel"><p>나의 조달 등급</p><h1>'+g+'</h1><p>최고 기록 별 합계 '+t+' / 9</p>'+S.best.map((b,i)=>'<p>'+ROUNDS[i].place+" · "+ROUNDS[i].thing+' '+(b?stars(b.stars)+' ('+b.score+'점)':"미도전")+'</p>').join("")+'</div><div class="panel fact"><h3>오늘 기억할 세 가지</h3><ul><li>필요한 물건과 수량을 먼저 확인해요.</li><li>업무에 필요한 조건을 정하고, 이유 없는 제한은 줄여요.</li><li>받은 물건이 약속한 조건에 맞는지 확인해요.</li></ul><p><b>좋은 조달은 물건을 많이 사는 일이 아니라, 필요한 사람이 제대로 쓰게 하는 일입니다.</b></p></div><h3>다시 도전 (최고 기록과 발견 기록은 유지돼요)</h3><div class="btns">'+ROUNDS.map((R,i)=>'<button class="btn sec" data-a="replay" data-r="'+i+'">의뢰 '+(i+1)+' 다시</button>').join("")+'</div><div class="panel"><p>조달청은 공공기관의 물품·용역 조달을 지원하고 전자조달 시스템 나라장터를 운영해요. 이 게임은 입찰·계약·대금 지급을 생략한 가상 체험이며, 모든 기관이 같은 방식으로 구매하는 것은 아니에요.</p><p class="small">공공조달에 대해 더 알고 싶다면 조달청·나라장터 공식 안내를 확인하세요. 아래 링크는 누를 때만 열리며 인터넷 연결이 필요해요.</p><p><a href="https://www.pps.go.kr" target="_blank" rel="noopener">조달청 누리집</a> · <a href="https://www.g2b.go.kr" target="_blank" rel="noopener">나라장터</a></p><details><summary>더 알아보기: 혁신제품 시범구매</summary><p>조달청은 지정된 혁신제품을 구매해 공공기관의 현장 사용과 평가·피드백을 지원하는 시범구매 사업을 운영해요. 새로운 기술이 현장에서 도움이 되는지 살펴보는 과정이에요. 이 게임 본편의 컴퓨터 구매가 그 사업이라는 뜻은 아니에요.</p></details></div><div class="btns"><button class="btn sky" data-a="share">공유 카드 만들기</button><button class="btn sec" data-a="reset">'+(S.confirmReset?"정말 처음부터? 기록이 모두 지워져요":"처음부터")+'</button></div>';}
function vShare(){return '<h2 tabindex="-1">공유 카드</h2><img class="sh" alt="공유 카드 미리보기: 등급과 라운드별 별점" src="'+S.shareUrl+'"><p class="small">모바일에서 저장이 안 되면 이미지를 길게 눌러 저장하세요.</p><div class="btns"><button class="btn" data-a="savesh">이미지 저장</button><button class="btn sec" data-a="closesh">닫기</button></div>';}

/* ===== 렌더 ===== */
const VIEWS={start:vStart,intro:vIntro,brief:vBrief,write:vWrite,review:vReview,deliver:vDeliver,result:vResult,end:vEnd,share:vShare};
function render(announce){
 document.documentElement.classList.toggle("big",S.opt.big);document.documentElement.classList.toggle("calm",S.opt.calm);
 topBar();const app=document.getElementById("app");app.innerHTML=VIEWS[S.screen]();
 if(S.focus){const el=app.querySelector(S.focus);S.focus=null;if(el){el.focus();return;}}
 const h=app.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:false});}
 if(announce)document.getElementById("live").textContent=announce;
 window.scrollTo(0,0);
}
function go(screen,announce){S.screen=screen;render(announce);}

/* ===== 진행 ===== */
function finish(id){
 if(id!==S.attempt||S.phase!=="delivery")return;
 S.phase="result";const picks=S.snap.map(x=>BY_ID[x]);const ev=evaluate(picks);
 S.res={round:S.round,picks,...ev};
 const b=S.best[S.round];if(!b||ev.stars>b.stars||(ev.stars===b.stars&&ev.score>b.score))S.best[S.round]={stars:ev.stars,score:ev.score,ids:S.snap.slice()};
 picks.forEach(c=>{if(c.s<2&&!S.seen.some(x=>x.id===c.id))S.seen.push({id:c.id,s:c.s});});
 S.shown=null;S.hint=false;
 (ev.stars===3?SFX.good:ev.stars===2?SFX.mid:SFX.bad)();
 go("result","결과: 별 "+ev.stars+"개, "+ev.score+"점");
}
function shareLine(){const z=S.seen.find(x=>x.s===0),o=z||S.seen[0];return o?BY_ID[o.id].o:"이번 플레이에서 발견한 문제 없음";}
function wrap(ctx,text,x,y,maxW,lh){let line="",yy=y;for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>maxW&&line&&!/[.,!?)」”]/.test(ch)){ctx.fillText(line,x,yy);line=ch;yy+=lh;}else line=t;}ctx.fillText(line,x,yy);return yy+lh;}
function makeShare(){
 const cv=document.createElement("canvas");cv.width=1080;cv.height=1350;const x=cv.getContext("2d");
 x.fillStyle="#fff8e1";x.fillRect(0,0,1080,1350);x.fillStyle="#81d4fa";x.fillRect(0,0,1080,220);
 x.fillStyle="#263238";x.textAlign="center";x.font="bold 76px sans-serif";x.fillText("융통성 제로 AI 납품봇",540,130);
 x.font="36px sans-serif";x.fillText("2026 조달청 AI 게임·콘텐츠 공모전",540,190);
 const t=totalStars();x.font="bold 40px sans-serif";x.fillText("나의 조달 등급",540,330);
 x.fillStyle="#e65100";x.font="bold 110px sans-serif";x.fillText(gradeOf(t),540,450);
 x.fillStyle="#263238";x.font="bold 44px sans-serif";x.fillText("최고 기록 별 합계 "+t+" / 9",540,540);
 x.textAlign="left";x.font="40px sans-serif";let y=640;
 S.best.forEach((b,i)=>{x.fillText(ROUNDS[i].place+" · "+ROUNDS[i].thing,120,y);x.fillStyle="#f9a825";x.fillText(b?"★".repeat(b.stars)+"☆".repeat(3-b.stars):"미도전",760,y);x.fillStyle="#263238";y+=80;});
 x.font="bold 38px sans-serif";x.fillText("발견한 사건",120,y+30);x.font="36px sans-serif";y=wrap(x,shareLine(),120,y+90,840,52);
 if(S.best.every(b=>b&&b.score===10)){x.fillStyle="#2e7d32";x.font="bold 40px sans-serif";x.fillText("최고 기록 전 라운드 만점",120,y+30);x.fillStyle="#263238";}
 x.textAlign="center";x.font="30px sans-serif";x.fillStyle="#546e7a";x.fillText("이 게임은 AI를 활용해 제작한 가상 체험입니다.",540,1290);
 return cv.toDataURL("image/png");
}

/* ===== 이벤트 ===== */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==="tsound"){S.opt.sound=!S.opt.sound;S.focus='[data-a=tsound]';render();return;}
 if(a==="tbig"){S.opt.big=!S.opt.big;S.focus='[data-a=tbig]';render();return;}
 if(a==="tcalm"){S.opt.calm=!S.opt.calm;S.focus='[data-a=tcalm]';render();return;}
 SFX.click();
 switch(a){
 case "start":go("intro");break;
 case "brief":newRound(0);go("brief");break;
 case "write":S.step=0;go("write");break;
 case "pick":{const it=ROUNDS[S.round].items[S.step];S.picks[S.step]=it.cards[+b.dataset.c].id;S.focus='.choice[aria-pressed=true]';render("조건을 기록했습니다.");break;}
 case "goto":S.step=+b.dataset.i;S.hint=false;go("write");break;
 case "prev":S.step=Math.max(0,S.step-1);S.hint=false;go("write");break;
 case "next":S.step=Math.min(4,S.step+1);S.hint=false;go("write");break;
 case "hint":S.hint=!S.hint;S.focus='[data-a=hint]';render();break;
 case "review":if(allPicked())go("review");break;
 case "edit":S.step=+b.dataset.i;S.hint=false;go("write");break;
 case "order":{if(!allPicked()||S.phase==="delivery")break;S.phase="delivery";S.attempt++;S.snap=S.picks.slice();const id=S.attempt;go("deliver");setTimeout(()=>finish(id),S.opt.calm?600:2800);break;}
 case "skipdel":finish(S.attempt);break;
 case "scene":S.shown=+b.dataset.i;S.focus='.row[aria-pressed=true]';render();break;
 case "fix":S.step=0;S.phase="idle";S.hint=false;go("write");break;
 case "again":newRound(S.round);go("write");break;
 case "nextr":if(S.fromEnd||S.round===2){S.fromEnd=false;go("end");}else{newRound(S.round+1);go("brief");}break;
 case "replay":S.fromEnd=true;newRound(+b.dataset.r);go("brief");break;
 case "share":S.shareUrl=makeShare();go("share");break;
 case "savesh":{const l=document.createElement("a");l.href=S.shareUrl;l.download="napumbot_share.png";document.body.appendChild(l);l.click();l.remove();break;}
 case "closesh":go("end");break;
 case "reset":if(!S.confirmReset){S.confirmReset=true;S.focus='[data-a=reset]';render();}else{S.confirmReset=false;S.best=[null,null,null];S.seen=[];S.fromEnd=false;newRound(0);go("start");}break;
 }
});
window.NAPUM={ROUNDS,BY_ID,evaluate,S};
render();
</script>
</body>
</html>
