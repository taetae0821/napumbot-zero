function evaluate(picks){
  if(picks.length!==5||picks.some(c=>!c))throw new Error("다섯 항목을 모두 선택하세요.");
  const score=picks.reduce((s,c)=>s+c.s,0);
  const issues=picks.filter(c=>c.s<2);
  const criticals=issues.filter(c=>c.crit);
  const stars=criticals.length?1:score===10?3:score>=6?2:1;
  const lead=criticals[0]||issues.find(c=>c.s===0)||issues[0]||null;
  return{score,stars,issues,criticals,lead,leadId:lead?lead.id:null};
}

function topBar(){document.getElementById('top').innerHTML=`<div class="brand"><div class="brand-mark"><svg viewBox="25 25 145 110" aria-hidden="true">${robot()}</svg></div><div>융통성 제로 AI 납품봇<small>PUBLIC PROCUREMENT LAB</small></div></div><div class="settings"><button class="icon-btn" data-a="sound" aria-label="소리 ${S.opt.sound?'끄기':'켜기'}" aria-pressed="${S.opt.sound}">${icon(S.opt.sound?'sound':'mute')}<span class="btn-label">소리 ${S.opt.sound?'켬':'끔'}</span></button><button class="icon-btn" data-a="big" aria-label="글자 크게" aria-pressed="${S.opt.big}">${icon('type')}<span class="btn-label">큰 글자</span></button><button class="icon-btn optional-setting" data-a="calm" aria-label="동작 줄이기" aria-pressed="${S.opt.calm}">${icon('motion')}</button><span class="settings-divider"></span><button class="icon-btn optional-setting" data-a="fullscreen" aria-label="전체 화면">${icon('full')}</button><button class="icon-btn" data-a="help" aria-label="도움말과 설정">${icon('help')}</button></div>`;}
function footer(){document.getElementById('footer').innerHTML=`<span>2026 조달청 AI 게임·콘텐츠 공모전 · AI를 활용해 제작한 창작 게임</span><span>${S.demo?'시연 모드 · 예시 선택으로 진행 중': '가상의 기관·수치·사건입니다.'} · <button class="footer-link" data-a="demo-toggle">${S.demoBar?'시연 도구 숨기기':'시연 도구'}</button> · <button class="footer-link" data-a="about">작품 안내</button></span>`;}
function vStart(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">필요한 만큼, 제대로 쓰게.</div><h1 tabindex="-1">융통성 제로<br><em>AI 납품봇</em></h1><p class="intro-text">“빠른 컴퓨터”를 주문했더니<br>바퀴를 달아 왔다고요?</p><p class="intro-text">말을 곧이곧대로 듣는 제로와 함께,<br>웃으며 고치는 우리 동네 공공조달.</p><div class="actions">${btn('start',icon('play')+'게임 시작','yellow')}${btn('demo-start',icon('film')+'시연 모드','secondary')}</div><div class="hero-meta"><span>3개의 의뢰</span><span>15번의 선택</span><span>클릭·터치로 플레이</span></div></div><div class="hero-art"><div class="hero-sticker">주문한 대로 왔다고? 이게 뭐야!</div>${stage(2,'r3_s2_0','“빠르죠? 저도 따라잡기 어렵습니다.”','제로의 납품 일지')}</div></section><section class="mission-strip" aria-label="오늘의 의뢰">${labels.map((x,i)=>`<div class="mission-teaser">${smallObject(i)}<div><strong>${x}</strong><p>${missionDescription[i]}</p></div></div>`).join('')}</section>`;}
function vIntro(){return head('ZERO’S FIRST DELIVERY','넉넉하게 부탁했을 뿐인데…','연습 장면이에요. 점수와 발견 기록에는 들어가지 않아요.')+`<div class="layout"><div>${stage(0,'intro','학생은 30명인데, 책상이 3,000개 도착했어요.','연습 시뮬레이션')}${dialogue('제로','넉넉하게라고 하셔서요. 3,000개면 충분하죠?','oops')}</div><div class="card"><span class="tag yellow">오늘의 임무</span><h2 style="margin-top:17px">제로에게<br>좋은 조건을 알려 주세요.</h2><p class="intro-text">필요한 사람과 수량을 확인하고,<br>다섯 가지 구매 조건을 골라요.</p><hr class="divider"><ul class="takeaway"><li><span>01</span>학교·도서관·민원실의 의뢰를 읽어요.</li><li><span>02</span>조건을 골라 제로에게 발주해요.</li><li><span>03</span>결과를 보고, 더 나은 조건으로 고쳐요.</li></ul>${dialogue('루루','실수해도 괜찮아요. 다시 고르면 되니까요!')}<div class="actions">${btn('first','첫 의뢰 받기')}${btn('first','소개 건너뛰기','quiet')}</div></div></div>`;}
function vBrief(){const R=ROUNDS[S.round];return route()+head(`MISSION 0${S.round+1}`,missionNames[S.round],'좋은 구매는 현장의 이야기를 듣는 것부터 시작해요.')+`<div class="layout"><div class="scene-column">${stage(S.round,'normal',R.normal.cap,'이런 일상을 만들어 주세요')}${dialogue('루루',R.req)}</div><div class="card request-card"><div class="fact-title"><h3>의뢰 메모</h3><span>조건을 고를 때 다시 볼 수 있어요</span></div>${facts()}<div class="info-note"><b>오늘의 포인트</b><br>${esc(R.learn)}</div><div class="actions">${btn('write','조건 작성 시작')}</div></div></div>`;}
function vWrite(){const R=ROUNDS[S.round],it=R.items[S.step],selected=S.picks[S.step];return route()+`<div class="stepper" role="group" aria-label="조건 항목">${R.items.map((x,i)=>`<button class="step ${i===S.step?'active':''} ${S.picks[i]?'picked':''}" data-a="goto" data-i="${i}" ${i===S.step?'aria-current="step"':''} aria-label="${i+1}. ${x.n}, ${S.picks[i]?'선택 완료':'아직 선택 안 함'}"><i>${S.picks[i]?'✓':i+1}</i><span>${x.n}</span></button>`).join('')}</div><div class="layout write-layout"><div class="scene-column">${stage(S.round,'normal',missionDescription[S.round],'의뢰 현장')}${dialogue('루루',R.req)}<details class="write-summary"><summary>의뢰 메모 다시 보기</summary>${facts()}</details></div><div class="card write-card"><div class="eyebrow">CONDITION ${S.step+1} / 5</div><h2 tabindex="-1">${it.n}, 어떻게 할까요?</h2><p class="small muted" style="margin-top:10px">현장에 맞는 조건을 하나 골라 주세요.</p><div class="choices" role="group" aria-label="${it.n} 조건 선택">${S.order[S.step].map((ci,j)=>{const c=it.cards[ci],picked=c.id===selected;return `<button class="choice" data-a="pick" data-c="${ci}" aria-pressed="${picked}"><span class="choice-marker" aria-hidden="true">${picked?'✓':['A','B','C'][j]}</span><span class="choice-copy">${esc(c.t)}${picked?'<span class="choice-selected">선택한 조건</span>':''}</span></button>`;}).join('')}</div><p class="feedback-neutral">${selected?'조건을 기록했어요. 발주 전까지 바꿀 수 있어요.':'정답은 납품 결과에서 확인할 수 있어요.'}</p><button class="text-btn" data-a="hint" aria-expanded="${S.hint}" aria-controls="hint-copy">${icon('hint')}루루에게 힌트 받기</button>${S.hint?`<div class="hint-text" id="hint-copy"><b>루루</b> ${esc(it.h)}<br><span class="small">힌트는 몇 번 써도 감점이 없어요.</span></div>`:''}<div class="actions">${S.step>0?btn('prev','이전','secondary'):''}${allPicked()||S.step===4?btn('review','발주 검토','',allPicked()?'':'disabled'):btn('next','다음 조건','',selected?'':'disabled')}</div>${S.step===4&&!allPicked()?'<p class="small muted" style="margin-top:14px">위 항목에서 아직 고르지 않은 조건을 선택해 주세요.</p>':''}</div></div>`;}
function vReview(){const R=ROUNDS[S.round];return route()+head('ORDER CHECK','이 조건대로 보내도 될까요?','수정할 항목이 있다면 발주 전에 바꿔 주세요.',S.demo?'<span class="demo-mark">시연용 예시 선택</span>':'')+`<div class="layout equal"><div class="card"><div class="fact-title"><h3>${R.place} 구매 요청서</h3><span>5개 조건 작성 완료</span></div><div class="review-list">${R.items.map((it,i)=>`<div class="review-row"><span class="num">0${i+1}</span><div class="review-copy"><b>${it.n}</b><p>${esc(BY_ID[S.picks[i]].t)}</p></div><button data-a="edit" data-i="${i}" aria-label="${it.n} 수정">수정</button></div>`).join('')}</div><div class="actions">${btn('order',icon('check')+'발주 확정','yellow')}${btn('edit','돌아가서 수정','secondary','data-i="0"')}</div></div><div>${stage(S.round,'delivery','확정한 조건을 읽고 제로가 출발해요.','발주 대기')}${dialogue('제로','조건 확인했습니다. 적힌 그대로 가져오겠습니다!')}</div></div>`;}
function vDelivery(){return `<div class="delivery-wrap">${head('DELIVERY IN PROGRESS','제로가 납품하러 갑니다!','어떤 물건이 도착할까요?')}${stage(S.round,'delivery','구매 조건 확인… 물품 준비… 현장으로 출발!','납품 중')}<div class="delivery-progress" aria-hidden="true"></div><p class="small muted">잠시 후 결과가 나타나요.</p><div class="actions">${btn('skip','연출 건너뛰기','secondary compact')}</div></div>`;}
function resultData(){const picks=S.res.ids.map(id=>BY_ID[id]);return {picks,...evaluate(picks)};}
function selectedResult(){const r=resultData();const sel=S.shown===null?(r.lead?r.picks.indexOf(r.lead):0):S.shown;return{...r,sel,c:r.picks[sel]};}
function resultScene(){const {c,score}=selectedResult(),R=ROUNDS[S.round],full=score===10;const key=full?'normal':c.s===2?'condition':c.id;const cap=full?R.normal.cap:c.s===2?c.o:(sceneNames[c.id]||c.o);const zeroLine=full?'이번에는 현장에 꼭 맞게 가져왔습니다!':c.s===2?'이 항목의 조건은 적절합니다. 다른 항목도 확인해 주세요.':c.zq;const luluLine=full?'필요한 만큼, 제대로 쓸 수 있게 준비했어요!':c.s===2?'이 장면은 선택한 조건 하나의 평가예요. 전체 결과와 구분해서 봐요.':specificLulu[c.id]||LULU_KIND[c.k];return stage(S.round,key,cap,full?'납품 성공':'선택한 조건의 결과')+`<div class="stage-note"><span>${full?'다섯 조건을 모두 충족했어요.':esc(c.t)}</span><button class="scene-replay" data-a="animate">${icon('replay')}다시 보기</button></div>`+dialogue('제로',zeroLine,c.s<2?'oops':'happy')+`<div class="lulu-note"><b>루루의 한마디</b><p>${esc(luluLine)}</p></div>`+`<p class="small muted result-disclaimer" style="margin:12px 3px 0;font-size:.67rem">가상의 과장된 예시예요. 점수는 구매 계획의 적합도이며 실제 물품 불량 판정이 아니에요.</p>`;}
function vResult(){const r=selectedResult(),R=ROUNDS[S.round];return route()+head('DELIVERY REPORT',`<span class="result-title"><span class="stamp ${r.stars<3?'warn':''}">${r.stars===3?'완료':'점검'}</span>${STAR_NAME[r.stars]}</span>`,'선택한 조건마다 어떤 일이 생겼는지 확인해 보세요.',`<div class="score">${stars(r.stars)}<div class="score-number">${r.score} <small>/ 10점</small></div></div>`)+`<div class="layout result-layout"><div class="scene-column" id="result-scene">${resultScene()}</div><div class="card"><div class="fact-title"><h3>내가 고른 5개의 조건</h3><span>눌러서 결과 보기</span></div>${r.criticals.length?`<div class="critical-note"><b>핵심 조건 때문에 별 1개로 제한됐어요.</b><br>${r.criticals.map(c=>esc(R.items[c.i].n)).join(' · ')} 항목에 큰 문제가 있어요.</div>`:''}<div class="result-list">${r.picks.map((c,i)=>`<button class="result-row" data-a="scene" data-i="${i}" aria-pressed="${r.sel===i}"><span class="status-dot ${c.s===2?'ok':c.s===1?'mid':'bad'}" aria-hidden="true">${c.s===2?'✓':c.s===1?'△':'!'}</span><span><strong>${R.items[i].n}<span class="status-name">${c.s===2?'적합':c.s===1?'보완 필요':'큰 문제'}</span>${c.crit?'<span class="pill">핵심</span>':''}</strong><span class="outcome">${esc(c.o)}</span></span></button>`).join('')}</div><div class="learn"><b>이 의뢰에서 배운 점</b>${esc(R.learn)}</div></div></div><div class="result-actions"><div class="actions">${btn('fix',icon('replay')+'조건 고치기','yellow')}${btn('again','새로 풀기','secondary')}</div>${btn('next-round',S.fromEnd||S.round===2?'마무리 보기':'다음 의뢰')}</div>`;}
function totalStars(){return S.best.reduce((sum,b)=>sum+(b?b.stars:0),0);}
function vEnd(){const t=totalStars(),played=S.best.filter(Boolean).length;return `<section class="ending"><div class="ending-visual"><div class="eyebrow">${S.demo?'DEMO REPORT':'MISSION REPORT'}</div>${medal()}<div class="rank">${played===3?gradeOf(t):'의뢰 진행 중'}</div><p class="rank-note">최고 기록 별 합계 <b>${t} / 9</b> · ${played}/3 의뢰 완료</p>${S.demo?'<span class="demo-mark" style="margin-top:12px">시연 기록 · 일반 플레이와 별도</span>':''}</div><div class="ending-copy"><h2 tabindex="-1">좋은 조달은,<br>필요한 사람이<br><span style="color:var(--blue)">제대로 쓰게 하는 일.</span></h2><div class="record-grid">${S.best.map((b,i)=>`<div class="record"><strong>${shortNames[i]} · ${ROUNDS[i].thing}</strong>${stars(b?b.stars:0)}<p>${b?`${b.score}/10점 · 최고 기록`:'아직 도전하지 않았어요'}</p><button data-a="replay" data-r="${i}">${b?'다시 도전':'의뢰 받기'}</button></div>`).join('')}</div><ul class="takeaway"><li><span>✓</span>필요한 물건과 수량부터 확인해요.</li><li><span>✓</span>이유 없는 업체·외형 제한을 줄여요.</li><li><span>✓</span>약속한 조건대로 왔는지 확인해요.</li></ul><div class="actions">${btn('share',icon('save')+'결과 카드 만들기','yellow')}${btn('reset','처음부터','secondary')}</div></div></section><details class="card end-details"><summary>우리 일상과 연결되는 조달청 · 나라장터</summary><p>조달청은 공공기관의 물품·용역 조달을 지원하고 전자조달 시스템 나라장터를 운영해요. 이 게임은 입찰·계약·대금 지급을 생략한 가상 체험이며, 기관마다 구매 방식은 다를 수 있어요.</p><p><a href="https://www.pps.go.kr" target="_blank" rel="noopener noreferrer">조달청 누리집</a><a href="https://www.g2b.go.kr" target="_blank" rel="noopener noreferrer">나라장터</a><span class="muted small">링크를 열 때 인터넷 연결이 필요해요.</span></p><h3>더 알아보기: 혁신제품 시범구매</h3><p>조달청은 지정된 혁신제품을 구매해 공공기관의 현장 사용과 평가·피드백을 지원하는 시범구매 사업을 운영해요. 본편의 일반 컴퓨터 구매가 이 사업이라는 뜻은 아니에요.</p></details>`;}
function vShare(){return head('MY PROCUREMENT CARD','오늘의 조달 기록','이미지를 저장해 나의 결과를 공유해 보세요.')+`<div class="share-layout"><img class="share-img" src="${S.shareUrl}" width="1080" height="1350" alt="${esc(S.shareAlt||'나의 조달 결과 카드')}"><div><span class="tag yellow">1080 × 1350 PNG</span><h2 style="margin-top:20px">웃으며 배우고,<br>기록으로 남겨요.</h2><p class="intro-text">라운드별 최고 기록과 플레이 중 발견한 사건이 담겨 있어요.</p><div class="actions">${btn('save-share',icon('save')+'이미지 저장')}${btn('close-share','마무리로 돌아가기','secondary')}</div><p class="small muted" style="margin-top:18px">모바일에서 저장 버튼이 작동하지 않으면 이미지를 길게 눌러 저장해 주세요.</p></div></div>`;}
const VIEWS={start:vStart,intro:vIntro,brief:vBrief,write:vWrite,review:vReview,delivery:vDelivery,result:vResult,end:vEnd,share:vShare};
function render({focus=null,announce='',scroll=true}={}){document.documentElement.classList.toggle('big',S.opt.big);document.documentElement.classList.toggle('calm',S.opt.calm);document.body.classList.toggle('demo-on',S.demoBar);topBar();document.getElementById('app').innerHTML=`<div class="screen-in">${VIEWS[S.screen]()}</div>`;footer();renderDemo();const target=focus?document.querySelector(focus):document.querySelector('#app h1,#app h2');if(target){if(!focus)target.setAttribute('tabindex','-1');target.focus({preventScroll:!scroll});}if(scroll)window.scrollTo({top:0,behavior:'instant'});if(announce)document.getElementById('live').textContent=announce;}
function go(screen,announce=''){S.screen=screen;render({announce});}
function order(){if(!allPicked()||S.phase==='delivery')return;S.phase='delivery';S.attempt++;const id=S.attempt;S.snap=S.picks.slice();sfx('order');go('delivery');deliveryTimer=setTimeout(()=>finish(id),S.opt.calm?500:2400);}
function finish(id){if(id!==S.attempt||S.phase!=='delivery')return;if(deliveryTimer!==null)clearTimeout(deliveryTimer);deliveryTimer=null;S.phase='result';const picks=S.snap.map(x=>BY_ID[x]),ev=evaluate(picks);S.res={round:S.round,ids:S.snap.slice()};const best=S.best[S.round];if(!best||ev.stars>best.stars||(ev.stars===best.stars&&ev.score>best.score))S.best[S.round]={stars:ev.stars,score:ev.score,ids:S.snap.slice()};picks.forEach(c=>{if(c.s<2&&!S.seen.includes(c.id))S.seen.push(c.id);});S.shown=null;S.hint=false;sfx(ev.stars===3?'good':'bad');go('result',`납품 결과. ${ev.score}점, 별 ${ev.stars}개. ${ev.criticals.length?'핵심 조건을 확인해 주세요.':''}`);}
function wrapCanvas(ctx,text,x,y,maxWidth,lineHeight){let line='';for(const char of text){if(ctx.measureText(line+char).width>maxWidth&&line){ctx.fillText(line,x,y);line='';y+=lineHeight;}line+=char;}if(line)ctx.fillText(line,x,y);return y+lineHeight;}
function shareIncident(){const id=S.seen.find(id=>BY_ID[id].s===0)||S.seen[0];return id?BY_ID[id].o:'이번 플레이에서 발견한 문제 없음';}
function makeShare(){const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;const c=cv.getContext('2d');if(!c)throw Error('이미지 생성 기능을 사용할 수 없어요.');c.fillStyle='#fffdf5';c.fillRect(0,0,1080,1350);c.fillStyle=BLUE;c.fillRect(0,0,1080,245);c.fillStyle='#fff';c.font='bold 61px "Malgun Gothic",sans-serif';c.textAlign='center';c.fillText('융통성 제로 AI 납품봇',540,112);c.font='27px "Malgun Gothic",sans-serif';c.fillText(S.demo?'시연 모드 · 예시 플레이 기록':'웃으며 고치는 우리 동네 공공조달',540,175);c.fillStyle=INK;c.font='bold 34px "Malgun Gothic",sans-serif';c.fillText('나의 조달 등급',540,331);const t=totalStars(),rank=S.best.every(Boolean)?gradeOf(t):'의뢰 진행 중';c.fillStyle=BLUE;c.font='bold 86px "Malgun Gothic",sans-serif';c.fillText(rank,540,445);c.fillStyle=INK;c.font='bold 36px "Malgun Gothic",sans-serif';c.fillText(`최고 기록 별 합계 ${t} / 9`,540,514);c.textAlign='left';S.best.forEach((b,i)=>{const y=590+i*115;c.fillStyle='#eaf0ff';c.fillRect(80,y,920,89);c.fillStyle=INK;c.font='bold 30px "Malgun Gothic",sans-serif';c.fillText(`${shortNames[i]} · ${ROUNDS[i].thing}`,108,y+54);c.fillStyle='#ac7800';c.font='bold 38px sans-serif';c.fillText(b?'★'.repeat(b.stars)+'☆'.repeat(3-b.stars):'—',650,y+54);c.fillStyle=INK;c.font='26px sans-serif';c.fillText(b?`${b.score}/10`:'미도전',877,y+52);});c.fillStyle=INK;c.font='bold 30px "Malgun Gothic",sans-serif';c.fillText('발견한 사건',90,1000);c.font='29px "Malgun Gothic",sans-serif';wrapCanvas(c,shareIncident(),90,1055,900,43);if(S.best.every(b=>b&&b.score===10)){c.fillStyle='#16764f';c.font='bold 28px "Malgun Gothic",sans-serif';c.fillText('최고 기록 전 라운드 만점',90,1215);}c.textAlign='center';c.fillStyle='#596e80';c.font='23px "Malgun Gothic",sans-serif';c.fillText('AI를 활용해 제작한 가상의 공공조달 체험',540,1297);S.shareAlt=`${S.demo?'시연 기록. ':''}${rank}. 최고 기록 별 합계 ${t}/9. ${S.best.map((b,i)=>`${shortNames[i]} ${b?`${b.score}점, 별 ${b.stars}개`:'미도전'}`).join('. ')}. 발견한 사건: ${shareIncident()}`;return cv.toDataURL('image/png');}
function showModal(type){modalReturn=document.activeElement;const texts={help:{title:'제로와 함께하는 방법',body:`<ul><li>의뢰를 읽고 다섯 가지 조건을 골라요.</li><li>발주하면 선택에 맞는 결과가 나와요.</li><li>‘조건 고치기’로 선택을 유지하며 수정할 수 있어요.</li><li>10점은 별 3개, 6~9점은 별 2개예요. 핵심 문제가 있으면 별 1개로 제한돼요.</li><li>새로고침하면 기록이 초기화돼요.</li></ul><div class="actions"><button class="icon-btn" data-a="modal-calm" aria-pressed="${S.opt.calm}">${icon('motion')}동작 줄이기 ${S.opt.calm?'켬':'끔'}</button><button class="icon-btn" data-a="fullscreen">${icon('full')}전체 화면</button></div><p class="small muted">키보드: Tab으로 이동, Enter·Space로 선택.<br>D: 시연 도구 표시 / R: 결과 장면 다시 보기.</p>`},about:{title:'이 게임에 대하여',body:'<p>학교·도서관·민원실의 구매 조건을 고치는 선택형 코미디 게임입니다. 제작 과정에 AI를 활용했으며, 실행 중 AI 모델을 호출하지 않습니다.</p><p>기관·수치·등장인물·사건은 창작 설정입니다. 실제 조달 규정이나 법률 판단을 대신하지 않습니다.</p><p>이름·연락처를 수집하지 않으며 진행 기록은 이 페이지를 연 동안만 유지됩니다. 그림과 효과음은 게임 내부에서 그리거나 합성합니다.</p>'},reset:{title:'처음부터 시작할까요?',body:'<p>현재 모드의 진행, 최고 기록, 발견한 사건이 모두 초기화돼요.</p>'},demo:{title:'녹화용 시연 모드',body:'<p>예시 조건을 자동으로 선택해 대표 장면을 빠르게 보여줍니다. 점수와 납품 결과는 일반 플레이와 같은 규칙으로 계산해요.</p><p>일반 플레이 기록은 보관되며 시연을 나가면 복원돼요. D로 도구 모음을 숨겨도 화면의 시연 표시는 유지됩니다.</p><p class="small muted">1 책상 소동 · 2 학교 수정 · 3 업체 제한<br>4 도서관 수정 · 5 바퀴 컴퓨터 · 6 민원실 수정<br>7 시연 결과 · 0 타이틀</p>'}};const data=texts[type];if(!data)return;document.getElementById('overlay').innerHTML=`<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="eyebrow">NAPUM BOT</div><h2 id="modal-title">${data.title}</h2>${data.body}<div class="actions">${type==='reset'?btn('confirm-reset','처음부터 시작','yellow'):type==='demo'?btn('auto-demo','60초 자동 시연','yellow')+btn('confirm-demo','직접 조작','secondary'):''}${btn('close-modal',type==='reset'||type==='demo'?'취소':'닫기','secondary')}</div></section></div>`;document.querySelector('.modal button')?.focus();}
function closeModal(){document.getElementById('overlay').innerHTML='';if(modalReturn?.isConnected)modalReturn.focus();modalReturn=null;}
function beginDemo(){if(S.phase==='delivery')return;if(!S.demo){demoBackup=JSON.parse(JSON.stringify(S));cancelDelivery();S.best=[null,null,null];S.seen=[];S.demo=true;S.fromEnd=false;}S.demoBar=true;newRound(0);go('intro');}

function sample(n){if(S.phase==='delivery')return;if(!S.demo)beginDemo();if(n===0){cancelDelivery();go('start');return;}if(n===7){cancelDelivery();go('end');return;}if(n<1||n>6)return;const r=Math.floor((n-1)/2),bad=n%2===1;newRound(r);S.fromEnd=false;S.picks=ROUNDS[r].items.map(it=>it.cards.find(c=>c.s===2).id);const idx=[0,3,1][r];S.picks[idx]=ROUNDS[r].items[idx].cards.find(c=>c.s===0).id;if(bad){order();}else{S.step=idx;go('write','시연용 수정 예시입니다. 선택을 확인하고 발주해 주세요.');}}
function renderDemo(){document.getElementById('demo').innerHTML=S.demoBar?`<div class="demo-bar" role="group" aria-label="시연 도구"><strong>${autoRunning?'자동 시연 중 · Esc로 중지':'시연 도구 · D로 숨기기'}</strong><button data-a="${autoRunning?'stop-auto':'auto-demo'}">${autoRunning?'중지':'60초 자동 시연'}</button>${['타이틀','책상 소동','학교 수정','업체 제한','도서관 수정','바퀴 컴퓨터','민원실 수정','결과'].map((txt,n)=>`<button data-a="sample" data-n="${n}" ${S.phase==='delivery'?'disabled':''}>${n} ${txt}</button>`).join('')}<button data-a="${S.demo?'leave-demo':'demo-toggle'}">${S.demo?'시연 나가기':'닫기'}</button></div>`:'';}

function animateScene(){const target=document.getElementById('result-scene');if(target){target.innerHTML=resultScene();sfx(selectedResult().c.s===2?'good':'bad');}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;if(autoRunning&&!['sound','big','calm','demo-toggle'].includes(a))stopAuto();if(a==='sound'||a==='big'||a==='calm'){S.opt[a]=!S.opt[a];document.documentElement.classList.toggle('big',S.opt.big);document.documentElement.classList.toggle('calm',S.opt.calm);topBar();document.querySelector(`[data-a="${a}"]`)?.focus({preventScroll:true});return;}sfx('click');switch(a){
 case 'start':S.fromEnd=false;go('intro');break;
 case 'first':newRound(0);go('brief');break;
 case 'write':S.step=0;go('write');break;
 case 'pick':{if(S.screen!=='write')break;S.picks[S.step]=ROUNDS[S.round].items[S.step].cards[+b.dataset.c].id;sfx('pick');render({focus:'.choice[aria-pressed="true"]',announce:'조건을 기록했어요. 발주 전까지 수정할 수 있어요.',scroll:false});break;}
 case 'goto':case 'edit':S.step=+b.dataset.i;S.hint=false;go('write');break;
 case 'prev':S.step=Math.max(0,S.step-1);S.hint=false;go('write');break;

 case 'hint':S.hint=!S.hint;render({focus:'[data-a="hint"]',scroll:false,announce:S.hint?ROUNDS[S.round].items[S.step].h:'힌트를 닫았어요.'});break;
 case 'review':if(allPicked())go('review');break;
 case 'order':order();break;
 case 'skip':finish(S.attempt);break;
 case 'scene':{S.shown=+b.dataset.i;const y=window.scrollY;render({focus:`.result-row[data-i="${S.shown}"]`,scroll:false,announce:BY_ID[S.res.ids[S.shown]].o});if(window.innerWidth<=760)document.getElementById('result-scene').scrollIntoView({behavior:S.opt.calm?'instant':'smooth',block:'start'});else window.scrollTo({top:y,behavior:'instant'});break;}
 case 'animate':animateScene();break;
 case 'fix':S.step=resultData().lead?.i||0;S.phase='idle';S.hint=false;go('write');break;
 case 'again':newRound(S.round);go('write');break;
 case 'next-round':if(S.fromEnd||S.round===2){S.fromEnd=false;go('end');}else{newRound(S.round+1);go('brief');}break;
 case 'replay':S.fromEnd=true;newRound(+b.dataset.r);go('brief');break;

 case 'save-share':{const link=document.createElement('a');link.href=S.shareUrl;link.download=S.demo?'napumbot-demo-card.png':'napumbot-result.png';document.body.appendChild(link);link.click();link.remove();break;}
 case 'close-share':go('end');break;

document.addEventListener('keydown',e=>{const modal=document.querySelector('.modal');if(modal){if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const nodes=Array.from(modal.querySelectorAll('button,a[href],input,[tabindex="0"]')).filter(el=>!el.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.key==='Escape'&&autoRunning){e.preventDefault();stopAuto();S.demoBar=true;document.body.classList.add('demo-on');renderDemo();footer();return;}if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key.toLowerCase()==='d'){e.preventDefault();S.demoBar=!S.demoBar;document.body.classList.toggle('demo-on',S.demoBar);renderDemo();footer();}if(e.key.toLowerCase()==='r'&&S.screen==='result'){e.preventDefault();animateScene();}if(S.demo&&/^[0-7]$/.test(e.key)){e.preventDefault();stopAuto();sample(+e.key);}});

 after(4,()=>sample(1));
 after(11,()=>sample(2));after(14,chooseGood);after(16,()=>go('review'));after(18,order);
